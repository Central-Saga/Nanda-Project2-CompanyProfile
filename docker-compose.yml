services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: compro
      POSTGRES_USER: compro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random hex POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U compro -d compro"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://compro:${POSTGRES_PASSWORD}@db:5432/compro
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      DATABASE_URL: postgresql://compro:${POSTGRES_PASSWORD}@db:5432/compro
      AUTH_SECRET: ${AUTH_SECRET:?Set a random AUTH_SECRET of at least 32 characters}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://host.docker.internal:9000}
      S3_BUCKET: ${S3_BUCKET:-compro-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
volumes:
  postgres-data:
